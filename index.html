<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tính Cost">
<meta name="description" content="Tính giá cost combo và sản phẩm lẻ TMĐT – chạy offline trên máy tính và điện thoại">
<title>Tính Cost Combo</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f4f6f8;--surface:#fff;--surface-2:#f0f3f6;--surface-3:#e7ecf1;
  --text:#18202a;--muted:#5d6b7b;--faint:#8a96a5;--border:#dde3ea;--border-strong:#c6cfd9;
  --accent:#0f766e;--accent-2:#115e59;--accent-soft:#ddf3f0;--accent-ink:#fff;
  --ok:#15803d;--ok-bg:#dcfce7;--bad:#b91c1c;--bad-bg:#fee2e2;--warn:#a16207;--warn-bg:#fef3c7;--info:#1d4ed8;--info-bg:#e0ecff;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 10px 30px rgba(16,24,40,.18);
  --r:12px;--r-sm:8px;
  --c1:#0f766e;--c2:#14b8a6;--c3:#6366f1;--c4:#f59e0b;--c5:#ef4444;--c6:#8b5cf6;--c7:#64748b;--c8:#ec4899;--c9:#22c55e;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1116;--surface:#161a21;--surface-2:#1c212a;--surface-3:#252b36;
  --text:#e5e9ee;--muted:#9ba7b6;--faint:#6f7b8a;--border:#2a313c;--border-strong:#3a4350;
  --accent:#2dd4bf;--accent-2:#5eead4;--accent-soft:#0f2e2b;--accent-ink:#04201d;
  --ok:#4ade80;--ok-bg:#0d2a18;--bad:#f87171;--bad-bg:#341213;--warn:#fbbf24;--warn-bg:#33270a;--info:#93b4ff;--info-bg:#15213b;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1116;--surface:#161a21;--surface-2:#1c212a;--surface-3:#252b36;
  --text:#e5e9ee;--muted:#9ba7b6;--faint:#6f7b8a;--border:#2a313c;--border-strong:#3a4350;
  --accent:#2dd4bf;--accent-2:#5eead4;--accent-soft:#0f2e2b;--accent-ink:#04201d;
  --ok:#4ade80;--ok-bg:#0d2a18;--bad:#f87171;--bad-bg:#341213;--warn:#fbbf24;--warn-bg:#33270a;--info:#93b4ff;--info-bg:#15213b;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.25}
h2{font-size:17px}
h3{font-size:15px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.hidden{display:none!important}

/* ---------- header & nav ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;padding-top:env(safe-area-inset-top)}
.topbar-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:16px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand-t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:9px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;white-space:nowrap}
.tab svg{width:18px;height:18px}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.savestate{font-size:12px;color:var(--faint);white-space:nowrap}
main{max-width:1320px;margin:0 auto;padding:16px 16px 40px}
@media (max-width:899px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;background:var(--surface);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom));justify-content:space-around;gap:0}
  .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;flex:1;min-width:0}
  .tab svg{width:22px;height:22px}
  .tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  main{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
  .savestate{margin-left:auto}
}

/* ---------- cards, layout ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-h .grow{flex:1}
.card-b{padding:16px}
.stack>*+*{margin-top:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.sticky{position:sticky;top:72px}
@media (max-width:1023px){.grid2{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.page-h h1{font-size:21px}
.page-h p{margin:2px 0 0;color:var(--muted);font-size:13px}

/* ---------- forms ---------- */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fields .full{grid-column:1/-1}
@media (max-width:560px){.fields{grid-template-columns:minmax(0,1fr)}}
.f label,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
.inp,select.inp,textarea.inp{width:100%;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-sm);padding:9px 11px;min-height:40px;outline:none;transition:border-color .15s,box-shadow .15s}
textarea.inp{min-height:140px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp.num{text-align:right}
.inp.big{font-size:18px;font-weight:700}
.inp.err{border-color:var(--bad)}
.inp-wrap{position:relative}
.inp-wrap .suf{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px;pointer-events:none}
.inp-wrap .inp{padding-right:30px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.hint{font-size:12px;color:var(--faint);margin-top:4px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:8px 13px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;min-height:38px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px;flex:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;min-height:32px;font-size:13px}
.btn.icon{padding:0;width:36px;min-height:36px}
.btn.icon.sm{width:30px;min-height:30px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-3);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}

/* ---------- product lines ---------- */
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 128px 110px 34px;gap:8px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.line.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--border))}
.line.warn{border-color:color-mix(in srgb,var(--warn) 55%,var(--border))}
.pick{display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;border:1px dashed var(--border-strong);background:var(--surface-2);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:44px;justify-content:center;min-width:0}
.pick.set{border-style:solid;background:var(--surface)}
.pick:hover{border-color:var(--accent)}
.pick .pc{font-size:12px;font-weight:700;color:var(--accent);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pick .pn{font-size:13.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .pe{font-size:12px;color:var(--bad);font-weight:600}
.qty{display:flex;align-items:center;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;height:40px;background:var(--surface)}
.qty button{border:0;background:var(--surface-2);width:34px;height:100%;cursor:pointer;font-size:18px;color:var(--muted);flex:none}
.qty input{border:0;width:100%;min-width:0;text-align:center;height:100%;background:transparent;outline:none;font-weight:700;font-variant-numeric:tabular-nums}
.lc{text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px}
.lc .u{display:block;font-size:11.5px;color:var(--faint)}
@media (max-width:560px){
  .line{grid-template-columns:minmax(0,1fr) 34px;grid-template-areas:"p x" "q c"}
  .line .pick{grid-area:p}.line .qty{grid-area:q;max-width:150px}.line .lc{grid-area:c}.line .rm{grid-area:x;align-self:start}
}
.lines-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--border-strong);border-radius:10px;font-size:14px}

/* ---------- result ---------- */
.verdict{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;margin-bottom:14px}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict.warn{background:var(--warn-bg);color:var(--warn)}
.verdict.none{background:var(--surface-2);color:var(--muted)}
.verdict .vt{font-size:22px;font-weight:800;letter-spacing:.2px}
.verdict .vs{font-size:13px;font-weight:600;opacity:.9}
.verdict .vp{margin-left:auto;text-align:right}
.verdict .vp b{font-size:24px;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:12px;color:var(--faint);margin-top:1px}
.kpi.hl{background:var(--accent-soft)}
.kpi.hl .v{color:var(--accent)}
.errs{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:14px}
.errs ul{margin:4px 0 0;padding-left:18px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-3);margin:4px 0 8px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

/* ---------- tables ---------- */
.tbl-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:10px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
table.t th{background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:700;position:sticky;top:0;z-index:1;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tr.sub td{color:var(--muted);font-size:12.5px}
table.t tr.sub td:first-child{padding-left:24px}
table.t tr.tot td{font-weight:800;background:var(--surface-2)}
table.t tr.hl td{font-weight:800;color:var(--accent)}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--surface-2)}
table.t td.wrap{white-space:normal;min-width:200px}
.tbl-b{border:0;border-radius:0}

/* ---------- list (cards on mobile) ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters .inp{width:auto;min-width:0}
.filters .search{flex:1;min-width:180px}
.clist{display:none}
@media (max-width:899px){
  .ctable{display:none}
  .clist{display:flex;flex-direction:column;gap:10px}
}
.citem{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.citem .ct{font-weight:700;font-size:14.5px}
.citem .cm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.citem .cm div{font-size:12px;color:var(--muted)}
.citem .cm b{display:block;color:var(--text);font-size:14px;font-variant-numeric:tabular-nums}
.citem .ca{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* ---------- mobile summary bar ---------- */
.mbar{display:none}
@media (max-width:1023px){
  .mbar{display:flex;position:fixed;left:8px;right:8px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:35;background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px 10px;gap:10px;align-items:center;cursor:pointer}
  .mbar .mb-k{font-size:11px;color:var(--muted)}
  .mbar .mb-v{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
}
@media (min-width:900px) and (max-width:1023px){.mbar{bottom:16px}}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:640px;display:flex;flex-direction:column;max-height:90vh}
.modal.wide{max-width:980px}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-h h2{flex:1}
.modal-b{padding:16px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border);flex-wrap:wrap}
@media (max-width:640px){
  .modal-bg{padding:0;align-items:flex-end}
  .modal{max-height:92vh;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom)}
}
.plist{display:flex;flex-direction:column;margin:10px -6px 0}
.pitem{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.pitem:hover,.pitem.act{background:var(--surface-2)}
.pitem .pi-m{font-weight:700;color:var(--accent);font-size:12.5px;min-width:88px}
.pitem .pi-n{flex:1;min-width:0;font-size:14px}
.pitem .pi-p{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:480px}
.toast{background:#1f2933;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:14px;animation:tin .2s ease-out}
.toast.bad{background:#991b1b}
.toast.ok{background:#166534}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (min-width:900px){.toasts{bottom:24px}}

/* ---------- param tables ---------- */
.ptable td .inp{min-height:34px;padding:6px 8px}
.ptable td{padding:5px 8px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:10px 14px;align-items:center}
.kv .kl{font-size:14px}
.kv .kl small{display:block;color:var(--faint);font-size:12px}
@media (max-width:560px){.kv{grid-template-columns:minmax(0,1fr) 120px}}
.sec-t{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:4px 0 10px}
.note{background:var(--info-bg);color:var(--info);border-radius:10px;padding:10px 12px;font-size:13.5px}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.dropzone{border:2px dashed var(--border-strong);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.dropzone:hover,.dropzone.over{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.help h3{margin:18px 0 6px}
.help ol,.help ul{padding-left:20px;margin:6px 0}
.help li{margin:4px 0}
.help code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:13px}

/* ---------- print ---------- */
#print-area{display:none}
@media print{
  body{background:#fff;color:#000}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block;font-size:12px}
  #print-area table{width:100%;border-collapse:collapse}
  #print-area th,#print-area td{border:1px solid #999;padding:4px 6px}
  #print-area .n{text-align:right}
  #print-area h1{font-size:18px;margin:0 0 4px}
  #print-area .pv{font-size:16px;font-weight:800;margin:8px 0}
}

</style>
</head>

<script id="seed" type="application/json"></script>
<script>
/* Tính giá cost combo & sản phẩm lẻ – ứng dụng chạy offline (một file HTML). */
(function(){
'use strict';
var APP_VER = '1.0.0';
var LS_KEY = 'acbt-cost-app-v1';

/* =========================================================
   1. TIỆN ÍCH
   ========================================================= */
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function norm(s){ return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().replace(/\s+/g, ' ').trim(); }
function up(s){ return String(s || '').trim().toUpperCase(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function isNum(x){ return typeof x === 'number' && isFinite(x); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function debounce(fn, ms){ var t; return function(){ var a = arguments, s = this; clearTimeout(t); t = setTimeout(function(){ fn.apply(s, a); }, ms); }; }
function fmt(n, d){ if (!isNum(n)) return '–'; d = d || 0; return n.toLocaleString('vi-VN', {minimumFractionDigits: d, maximumFractionDigits: d}); }
function fmt2(n){ if (!isNum(n)) return ''; return n.toLocaleString('vi-VN', {maximumFractionDigits: 2}); }

function pctVal(x){ if (!isNum(x)) return ''; return String(Number((x * 100).toFixed(4))).replace('.', ','); }
function parseNum(s){
  if (typeof s === 'number') return s;
  s = String(s == null ? '' : s).trim().replace(/\s|vnđ|vnd|đ|%/gi, '');

  if (/^-?\d{1,3}([.,]\d{3})+$/.test(s)) return +s.replace(/[.,]/g, '');
  if (s.indexOf('.') >= 0 && s.indexOf(',') >= 0){
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.'); else s = s.replace(/,/g, '');
  } else s = s.replace(',', '.');

}

function fmtDate(iso){ if (!iso) return ''; var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso); return m ? m[3] + '/' + m[2] + '/' + m[1] : iso; }

    try {

      d.innerHTML = html || esc(text).replace(/\n/g, '<br>'); document.body.appendChild(d);
      var rg = document.createRange(); rg.selectNodeContents(d); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
      var ok = document.execCommand('copy'); sel.removeAllRanges(); d.remove(); return Promise.resolve(ok);
    } catch (e){ return Promise.resolve(false); }
  }
  try {
    if (html && navigator.clipboard && window.ClipboardItem){
      return navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([html], {type: 'text/html'}), 'text/plain': new Blob([text], {type: 'text/plain'})})]).then(function(){ return true; }, fallback);
    }

function openPicker(o){
  var mode = o.mode || 'goods';
  var pool = S.products.filter(function(p){ return mode === 'box' ? p.pl === 'Hộp' : mode === 'all' ? true : p.pl !== 'Hộp'; });
  var order = {'Hàng hóa': 0, 'Quà tặng': 1, 'Vật tư/Khác': 2, 'Hộp': 3};
  pool.sort(function(a, b){ return (order[a.pl] == null ? 4 : order[a.pl]) - (order[b.pl] == null ? 4 : order[b.pl]) || a.ma.localeCompare(b.ma); });
  pool.forEach(function(p){ p._h = norm(p.ma + ' ' + p.ten + ' ' + (p.alias || '')); });
  var act = 0, shown = [];
  var m = modal({title: o.title || 'Chọn sản phẩm', body:
    (o.note ? '<div class="note warn" style="margin-bottom:10px">' + o.note + '</div>' : '') +
    '<div class="inp-wrap"><input class="inp" id="pq" placeholder="Gõ mã hoặc tên (không cần dấu), VD: chan ga 26" autocomplete="off" value="' + esc(o.q || '') + '"><span class="suf">' + ic('search').replace('<svg', '<svg width="16" height="16"') + '</span></div>' +
    '<div class="plist" id="pl"></div>'});
  function draw(){
    var q = norm(m.$('#pq').value), terms = q.split(' ').filter(Boolean);
    shown = pool.filter(function(p){ return terms.every(function(t){ return p._h.indexOf(t) >= 0; }); }).slice(0, 150);
    if (act >= shown.length) act = 0;
    m.$('#pl').innerHTML = shown.length ? shown.map(function(p, i){
      return '<button class="pitem ' + (i === act ? 'act' : '') + '" data-i="' + i + '"><span class="pi-m">' + esc(p.ma) + '</span><span class="pi-n">' + esc(p.ten) +
        (p.xop ? ' <span class="chip info">' + esc(p.xop) + '</span>' : '') + (p.pl && p.pl !== 'Hàng hóa' ? ' <span class="chip">' + esc(p.pl) + '</span>' : '') + '</span>' +
        '<span class="pi-p">' + (p.gia > 0 ? fmt(p.gia) + 'đ<br><span class="faint">/' + esc(p.dvt || 'đv') + '</span>' : '<span class="chip bad">Thiếu giá</span>') + '</span></button>';
    }).join('') : '<div class="empty">Không tìm thấy. Kiểm tra lại mã/tên, hoặc thêm sản phẩm mới ở tab “Sản phẩm”.</div>';
  }
  function pick(i){ var p = shown[i]; if (!p) return; m.close(); o.onPick(p); }
  m.$('#pq').addEventListener('input', function(){ act = 0; draw(); });
  m.$('#pq').addEventListener('keydown', function(e){
    if (e.key === 'ArrowDown'){ act = Math.min(shown.length - 1, act + 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp'){ act = Math.max(0, act - 1); draw(); e.preventDefault(); }
    else if (e.key === 'Enter'){ pick(act); e.preventDefault(); }
  });
  m.$('#pl').addEventListener('click', function(e){ var b = e.target.closest('[data-i]'); if (b) pick(+b.dataset.i); });
  draw();
  setTimeout(function(){ var i = m.$('#pq'); if (i){ i.focus(); i.select(); } }, 30);
}

var STOP = {x: 1, sl: 1, so: 1, luong: 1, combo: 1, gom: 1, va: 1, cac: 1, voi: 1, cho: 1, 'san': 1, pham: 1, gia: 1, ban: 1, de: 1, xuat: 1};
function toks(s){ return norm(s).replace(/[^a-z0-9 ]+/g, ' ').split(' ').filter(function(w){ return w.length >= 2 && !STOP[w]; }); }
function sizeToks(arr){ return arr.filter(function(w){ return /^\d+(g|gr|gram|ml|kg|l|lit)$/.test(w); }).map(function(w){ return w.replace(/gr$|gram$/, 'g'); }); }
function buildMatcher(){
  var codes = new Map(), prefixes = new Set(), names = [];
  S.products.forEach(function(p){
    codes.set(up(p.ma), p); aliases(p).forEach(function(a){ if (!codes.has(a)) codes.set(a, p); });
    var m = /^[A-Za-z]+/.exec(p.ma); if (m) prefixes.add(m[0].toUpperCase());
    var tk = toks(p.ten); names.push({p: p, n: norm(p.ten), set: new Set(tk), size: sizeToks(tk)});

function findProduct(text, M){

  for (i = 0; i < cand.length; i++){

    if (pm && M.prefixes.has(pm[0]) && /\d{2,}/.test(c2) && pm[0].length >= 2){

      return guess ? {p: guess.p, code: c2, by: 'suggest', name: guess.name} : {p: null, code: c2, by: 'unknown'};

function matchName(text, M){

  return v >= 1000 ? v : null;
}
function qtyFrom(text, found){
  var s = ' ' + text.replace(/\([^)]*\)/g, ' ') + ' ';
  if (found && found.code) s = s.split(found.code).join(' ').replace(new RegExp(found.code.replace(/[-.]/g, '\\$&'), 'ig'), ' ');
  var n = norm(s);
  if (found && found.name) n = n.split(found.name).join(' ');
  var m = /(?:^|[^a-z0-9])(?:x|\*|×)\s*(\d+(?:[.,]\d+)?)(?![\d.,]*\s*(?:g|ml|gr|kg)\b)/.exec(n) || /(?:sl|so luong|s\.l)\s*[:=]?\s*(\d+(?:[.,]\d+)?)/.exec(n) ||
    /(?:^|\s)(\d+(?:[.,]\d+)?)\s*(?:goi|hu|chai|tui|hop|cai|lo|sp|bich|thanh|phan|suat|set|cay|vi|lon)\b/.exec(n) || /^\s*(\d+(?:[.,]\d+)?)\s+[a-z]/.exec(n);

function parsePaste(text){
  var M = buildMatcher(), groups = [], cur = null, ignored = [];
  function newGroup(name, price){ cur = {name: name || '', price: price || null, lines: []}; groups.push(cur); return cur; }
  text.split(/\r?\n/).forEach(function(raw){
    var line = raw.replace(/ /g, ' ');
    if (!line.trim()) return;
    var cells = line.split('\t').map(function(c){ return c.trim(); });
    var body = line.replace(/^\s*(?:[-•*+–·]|\d{1,2}[.)])\s+/, '');

      for (var i = 0; i < cells.length; i++){ if (!cells[i]) continue; var ff = findProduct(cells[i], M); if (ff && rank[ff.by] != null){ if (!f || rank[ff.by] > rank[f.by]){ f = ff; pi = i; } if (ff.by === 'code') break; } }

        var gname = '';

        var price = null;

}

function viewData(v){
  var df = S.ui.df || (S.ui.df = {q: '', pl: '', miss: false});
  var miss = S.products.filter(function(p){ return !(p.gia > 0); }).length;
  var seedInfo = S.meta.importedAt ? 'Nhập từ Excel lúc ' + S.meta.importedAt + (S.meta.importFile ? ' (' + S.meta.importFile + ')' : '') : (S.meta.seed && S.meta.seed.source ? 'Dữ liệu gốc: ' + S.meta.seed.source : '');

    '<div class="row"><button class="btn pri" data-a="imx">' + ic('upload') + 'Nhập từ file Excel</button><button class="btn" data-a="pprice">' + ic('paste') + 'Dán bảng giá</button><button class="btn" data-a="addp">' + ic('plus') + 'Thêm SP</button><button class="btn" data-a="xlsx">' + ic('download') + 'Xuất Excel</button></div></div>' +
    '<div class="card" style="margin-bottom:16px"><div class="card-h"><h2 class="grow">Sao lưu & chuyển dữ liệu sang máy khác</h2></div><div class="card-b"><div class="row"><button class="btn" data-a="bk">' + ic('download') + 'Xuất file sao lưu (.json)</button><button class="btn" data-a="rs">' + ic('upload') + 'Khôi phục từ file sao lưu</button>' + (SEED ? '<button class="btn ghost danger" data-a="reset">Khôi phục dữ liệu gốc</button>' : '') + '</div><p class="hint">Dữ liệu chỉ lưu trong trình duyệt của máy này. Muốn dùng trên điện thoại/máy khác: Xuất file sao lưu → gửi qua Zalo/Email/USB → mở app trên máy kia → Khôi phục. Nên xuất sao lưu định kỳ.' + (STORAGE_OK ? '' : ' <b style="color:var(--bad)">Trình duyệt này đang chặn lưu dữ liệu – mọi thay đổi sẽ mất khi đóng trang!</b>') + '</p></div></div>' +
    '<div class="card"><div class="card-h"><div class="filters" style="flex:1"><input class="inp search" data-d="q" value="' + esc(df.q) + '" placeholder="Tìm mã, tên, mã khác…"><select class="inp" data-d="pl"><option value="">Mọi phân loại</option>' + PL_LIST.map(function(x){ return '<option' + (df.pl === x ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select><label class="row small"><input type="checkbox" data-d="miss"' + (df.miss ? ' checked' : '') + '> Chỉ mã thiếu giá</label></div></div>' +
    '<div class="tbl-wrap tbl-b" id="dt"></div></div>';
  function draw(){
    var q = norm(df.q);
    var rows = S.products.filter(function(p){ return (!q || norm(p.ma + ' ' + p.ten + ' ' + (p.alias || '')).indexOf(q) >= 0) && (!df.pl || p.pl === df.pl) && (!df.miss || !(p.gia > 0)); });
    $('#dt').innerHTML = '<table class="t"><thead><tr><th>Mã</th><th>Tên hàng</th><th>ĐVT</th><th>Phân loại</th><th>Loại xốp</th><th class="n" style="min-width:130px">Giá nhập (gồm VAT)</th><th class="n">Chưa VAT</th><th>Mã khác</th><th></th></tr></thead><tbody>' +
      rows.slice(0, 600).map(function(p){ return '<tr data-ma="' + esc(p.ma) + '"><td><b>' + esc(p.ma) + '</b></td><td class="wrap">' + esc(p.ten) + '</td><td>' + esc(p.dvt) + '</td><td>' + esc(p.pl) + '</td><td>' + esc(p.xop) + '</td>' +
        '<td class="n"><input class="inp num" inputmode="decimal" data-price value="' + moneyVal(p.gia) + '" style="min-height:34px;padding:5px 8px;' + (p.gia > 0 ? '' : 'border-color:var(--bad)') + '" placeholder="Thiếu giá"></td><td class="n" data-nv>' + (p.gia > 0 ? fmt2(p.gia / (1 + S.params.vatVao)) : '') + '</td><td class="small muted">' + esc(p.alias || '') + '</td><td><button class="btn icon sm ghost" data-a="editp" title="Sửa">' + ic('edit') + '</button></td></tr>'; }).join('') +
      (rows.length ? '' : '<tr><td colspan="9"><div class="empty">Không có sản phẩm. Bấm “Nhập từ file Excel” để nạp danh mục & giá.</div></td></tr>') + '</tbody></table>';
  }
  draw();
  v.oninput = function(e){ var t = e.target;
    if (t.dataset.d){ df[t.dataset.d] = t.type === 'checkbox' ? t.checked : t.value; saveSoon(); draw(); return; }
    if ('price' in t.dataset){ var p = prod(t.closest('[data-ma]').dataset.ma); if (!p) return; p.gia = numOrNull(t.value); t.style.borderColor = p.gia > 0 ? '' : 'var(--bad)'; var nv = t.closest('tr').querySelector('[data-nv]'); if (nv) nv.textContent = p.gia > 0 ? fmt2(p.gia / (1 + S.params.vatVao)) : ''; S.meta.priceEdited = nowText(); saveSoon(); renderNav(); }
  };
  v.onchange = function(e){ var t = e.target; if ('price' in t.dataset) t.value = moneyVal(numOrNull(t.value)); };

    var b = e.target.closest('[data-a]'); if (!b) return; var a = b.dataset.a;
    if (a === 'editp') editProduct(prod(b.closest('[data-ma]').dataset.ma), function(){ draw(); renderNav(); });
    else if (a === 'addp') editProduct(null, function(){ viewData(v); renderNav(); });
    else if (a === 'imx') pickFile('.xlsx,.xlsm,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', importExcelFile);
    else if (a === 'pprice') pastePrices(function(){ viewData(v); renderNav(); });
    else if (a === 'xlsx'){
      var rows = [[{v: 'DANH MỤC HÀNG HOÁ & GIÁ NHẬP – ' + fmtDate(today()), s: 't'}], [], ['STT', 'Mã hàng hóa', 'Tên hàng hóa', 'ĐVT', 'Phân loại', 'Loại xốp', 'Đơn giá dùng tính cost (gồm VAT)', 'Đơn giá chưa VAT', 'Mã khác'].map(function(x){ return {v: x, s: 'h'}; })];
      S.products.forEach(function(p, i){ rows.push([i + 1, p.ma, p.ten, p.dvt, p.pl, p.xop, p.gia > 0 ? {v: p.gia, s: 'm'} : 'THIẾU GIÁ', p.gia > 0 ? {v: p.gia / (1 + S.params.vatVao), s: 'm'} : '', p.alias || '']); });
      download('DanhMucGiaNhap_' + today() + '.xlsx', xlsxBlob([{name: 'GIÁ NHẬP', rows: rows, cols: [6, 13, 52, 8, 12, 14, 16, 14, 20], freeze: 3}]));
    }
    else if (a === 'bk') exportBackup();
    else if (a === 'rs') pickFile('.json,application/json', restoreBackup);
    else if (a === 'reset'){ if (confirm('Khôi phục toàn bộ dữ liệu gốc đi kèm app (danh mục, giá, tham số, combo)? Mọi thay đổi sau đó sẽ bị thay thế. Nên Xuất file sao lưu trước.')){ var th = S.ui.theme; S = migrate(fromSeed()); S.ui.theme = th; rebuildIndex(); save(); go('data'); toast('Đã khôi phục dữ liệu gốc', 'ok'); } }
  };
}
function editProduct(p, done){
  var isNew = !p, x = p ? clone(p) : {ma: '', ten: '', dvt: '', pl: 'Hàng hóa', xop: '', gia: null, alias: ''};
  var used = p ? S.combos.filter(function(c){ return c.items.some(function(i){ return prod(i.ma) === p; }); }).length : 0;
  var m = modal({title: isNew ? 'Thêm sản phẩm' : 'Sửa sản phẩm ' + p.ma, body: '<div class="fields">' +
    '<div class="f"><label>Mã hàng hóa</label><input class="inp" id="e-ma" value="' + esc(x.ma) + '"' + (isNew ? '' : ' readonly style="opacity:.7"') + '></div>' +
    '<div class="f"><label>ĐVT</label><input class="inp" id="e-dvt" value="' + esc(x.dvt) + '" placeholder="Gói / Hũ / Chai…"></div>' +
    '<div class="f full"><label>Tên hàng hóa</label><input class="inp" id="e-ten" value="' + esc(x.ten) + '"></div>' +
    '<div class="f"><label>Phân loại</label><select class="inp" id="e-pl">' + PL_LIST.map(function(o){ return '<option' + (x.pl === o ? ' selected' : '') + '>' + o + '</option>'; }).join('') + '</select></div>' +
    '<div class="f"><label>Loại xốp (định mức xốp & tem)</label><select class="inp" id="e-xop"><option value="">Không</option>' + S.xop.map(function(o){ return '<option' + (x.xop === o.loai ? ' selected' : '') + '>' + esc(o.loai) + '</option>'; }).join('') + '</select></div>' +
    '<div class="f"><label>Đơn giá nhập (đ, đã gồm VAT)</label><input class="inp num" inputmode="decimal" id="e-gia" value="' + moneyVal(x.gia) + '"></div>' +
    '<div class="f"><label>Mã khác (MISA / sàn), cách nhau dấu phẩy</label><input class="inp" id="e-al" value="' + esc(x.alias || '') + '" placeholder="VD: HH00063"></div>' +
    '</div>' + (used ? '<p class="hint">Đang dùng trong ' + used + ' combo.</p>' : ''),
    foot: (isNew ? '' : '<button class="btn danger" data-a="del">' + ic('trash') + 'Xoá</button><span class="spacer"></span>') + '<button class="btn" data-x>Huỷ</button><button class="btn pri" data-a="ok">Lưu</button>'});
  m.el.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    if (b.dataset.a === 'del'){ if (confirm('Xoá sản phẩm ' + p.ma + '?' + (used ? ' Sản phẩm đang dùng trong ' + used + ' combo – các combo đó sẽ báo “Mã không có trong danh mục”.' : ''))){ S.products = S.products.filter(function(q){ return q !== p; }); rebuildIndex(); save(); m.close(); done(); toast('Đã xoá sản phẩm'); } return; }
    var ma = m.$('#e-ma').value.trim(); if (!ma) return toast('Nhập mã hàng', 'bad');
    if (isNew && PIDX.has(up(ma))) return toast('Mã ' + ma + ' đã có trong danh mục', 'bad');
    var t = isNew ? {ma: ma} : p;
    t.ten = m.$('#e-ten').value.trim(); t.dvt = m.$('#e-dvt').value.trim(); t.pl = m.$('#e-pl').value; t.xop = m.$('#e-xop').value; t.gia = numOrNull(m.$('#e-gia').value); t.alias = m.$('#e-al').value.trim();
    if (isNew) S.products.push(t);
    rebuildIndex(); save(); m.close(); done(); toast('Đã lưu sản phẩm ' + ma, 'ok');
  });
}
function pastePrices(done){
  var parsed = [];
  var m = modal({title: 'Dán bảng giá nhập', wide: true, sticky: true, body:
    '<p class="muted small" style="margin-top:0">Copy 2 cột từ Excel/MISA: <b>Mã hàng</b> và <b>Đơn giá</b> (cột giữa có thể có tên hàng – app tự lấy số cuối dòng làm giá).</p>' +
    '<textarea class="inp" id="pp" placeholder="ACBT-G001\t4320\nACBT-S001\tSốt muối ớt 200ml\t14040"></textarea>' +
    '<div class="row" style="margin-top:10px"><label class="row small"><input type="checkbox" id="pnv"> Giá dán là giá <b>chưa VAT</b> (tự nhân thêm ' + fmtP(S.params.vatVao, 0) + ')</label><span class="spacer"></span><button class="btn pri" data-a="parse">Phân tích</button></div><div id="ppr" style="margin-top:12px"></div>',
    foot: '<button class="btn" data-x>Huỷ</button><button class="btn pri" data-a="ok" disabled>Cập nhật giá</button>'});
  m.el.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return;
    if (b.dataset.a === 'parse'){
      var nv = m.$('#pnv').checked; parsed = [];
      m.$('#pp').value.split(/\r?\n/).forEach(function(line){
        var cells = line.split('\t').map(function(c){ return c.trim(); }).filter(Boolean); if (cells.length < 2) cells = line.trim().split(/\s+/);
        if (cells.length < 2) return;
        var code = cells[0], price = null;
        for (var i = cells.length - 1; i >= 1; i--){ var n = parseNum(cells[i]); if (isNum(n) && n > 0){ price = n; break; } }
        if (price == null) return;
        if (nv) price = price * (1 + S.params.vatVao);
        parsed.push({code: code, p: prod(code), price: price});
      });
      var ch = parsed.filter(function(x){ return x.p && Math.abs((x.p.gia || 0) - x.price) > 0.005; }), unk = parsed.filter(function(x){ return !x.p; });
      m.$('#ppr').innerHTML = parsed.length ? '<p class="small"><b>' + parsed.length + '</b> dòng · <b>' + ch.length + '</b> mã đổi giá · ' + unk.length + ' mã chưa có trong danh mục' + (unk.length ? ' (bỏ qua: ' + esc(unk.slice(0, 12).map(function(x){ return x.code; }).join(', ')) + (unk.length > 12 ? '…' : '') + ')' : '') + '</p>' +
        '<div class="tbl-wrap"><table class="t"><thead><tr><th>Mã</th><th>Tên</th><th class="n">Giá cũ</th><th class="n">Giá mới</th><th class="n">Chênh</th></tr></thead><tbody>' + ch.map(function(x){ var o = x.p.gia || 0; return '<tr><td><b>' + esc(x.p.ma) + '</b></td><td class="wrap">' + esc(x.p.ten) + '</td><td class="n">' + fmt2(x.p.gia) + '</td><td class="n"><b>' + fmt2(x.price) + '</b></td><td class="n" style="color:var(' + (x.price > o ? '--bad' : '--ok') + ')">' + (o ? fmtP((x.price - o) / o) : 'mới') + '</td></tr>'; }).join('') + (ch.length ? '' : '<tr><td colspan="5" class="muted">Không có mã nào thay đổi giá.</td></tr>') + '</tbody></table></div>' : '<div class="empty">Không đọc được dòng nào có Mã + Giá.</div>';
      m.$('[data-a="ok"]').disabled = !ch.length;

    '<div class="kl">Giao diện</div><select class="inp" data-theme><option value="auto"' + (S.ui.theme === 'auto' ? ' selected' : '') + '>Theo máy</option><option value="light"' + (S.ui.theme === 'light' ? ' selected' : '') + '>Sáng</option><option value="dark"' + (S.ui.theme === 'dark' ? ' selected' : '') + '>Tối</option></select>' +
  '</div></div></div>' +
  '</div></div>';
  function calcs(){
    var r = fctRate({fctAuto: true});
    $$('[data-calc="fct"]', v).forEach(function(el){ el.textContent = fmtP(r, 3); });
    S.kenh.forEach(function(K, i){ var el = $('[data-calc="bd' + i + '"]', v); if (el){ var fr = fctRate(K); el.textContent = fmtP((K.roas > 0 ? 1 / K.roas : 0) + P.vatRa / (1 + P.vatRa) + K.vh + K.san * (1 + fr) + (+K.aff || 0)); } });
    S.xop.forEach(function(x, i){ var el = $('[data-calc="x' + i + '"]', v); if (el) el.textContent = x.spCuon > 0 ? fmt2(x.giaCuon / x.spCuon) : '–'; });
    S.box.forEach(function(b, i){ var el = $('[data-calc="b' + i + '"]', v); if (el) el.textContent = b.donCuon > 0 ? fmt2(bdCuonGia() / b.donCuon) : fmt2(P.bdMacDinh) + ' (mặc định)'; });
  }
  calcs();
  v.oninput = function(e){
    var t = e.target;
    if (t.dataset.p){
      var path = t.dataset.p.split('.'), kind = t.dataset.k, val;
      if (kind === 'text') val = t.value.trim(); else { var n = parseNum(t.value); val = isNum(n) ? (kind === 'pct' ? n / 100 : n) : 0; }
      var o = S; for (var i = 0; i < path.length - 1; i++) o = o[path[i]]; o[path[path.length - 1]] = val;
      if (path[1] === 'theCaoMa' || path[1] === 'bangDinhMa' || path[0] === 'xop'){ /* sẽ cập nhật khi rời ô */ }
      calcs(); saveSoon();
    } else if ('targets' in t.dataset){
      var arr = t.value.split(/[;|]|,(?=\s)|\s{2,}/).map(function(x){ return parseNum(x); }).filter(isNum).map(function(x){ return x / 100; });
      if (arr.length) { S.ui.targets = arr; saveSoon(); }
    }
  };
  v.onchange = function(e){
    var t = e.target;
    if (t.dataset.auto != null){ S.kenh[+t.dataset.auto].fctAuto = t.checked; saveSoon(); viewParams(v); return; }
    if ('theme' in t.dataset){ S.ui.theme = t.value; applyTheme(); saveSoon(); return; }
    if (t.dataset.p){ var kind = t.dataset.k; if (kind === 'money') t.value = moneyVal(numOrNull(t.value)); if (/theCaoMa|bangDinhMa|xop\.\d+\.loai/.test(t.dataset.p)){ save(); viewParams(v); } }
  };
  v.onclick = function(e){
    var b = e.target.closest('[data-a]'); if (!b) return; var a = b.dataset.a, i = +b.dataset.i;
    if (a === 'addx') S.xop.push({loai: 'Loại mới', giaCuon: 0, spCuon: 0, tem: 0});
    else if (a === 'delx'){ if (!confirm('Xoá loại xốp “' + S.xop[i].loai + '”?')) return; S.xop.splice(i, 1); }
    else if (a === 'addb') S.box.push({ma: '', kt: '', donCuon: 0, ghichu: ''});
    else if (a === 'delb'){ if (!confirm('Xoá định mức hộp ' + S.box[i].ma + '?')) return; S.box.splice(i, 1); }
    else return;
    save(); viewParams(v);
  };
}

  '<li>Bấm <b>Lưu combo</b>. Sang tab <b>Danh sách</b> để copy kết quả cho phòng vận hành sàn (chỉ Đạt/Không đạt + giá KTT đề xuất) hoặc báo cáo chi tiết cho giám đốc, hoặc <b>Xuất Excel</b> (3 sheet: KẾT QUẢ COMBO, TRẢ KẾT QUẢ SÀN, CHI TIẾT COMBO).</li>' +
  '<li>Combo đã copy trả kết quả được đánh dấu <span class="chip info">Đã trả</span>. Nếu sau đó giá nhập/tham số đổi làm kết quả khác đi, app báo <span class="chip warn">⚠ Đổi sau khi trả</span>.</li></ol>' +
  '<h3>Cập nhật giá nhập & tham số hàng tháng</h3><ul>' +
  '<li><b>Cách 1:</b> tab <b>Sản phẩm</b> → <b>Nhập từ file Excel</b> → chọn file bảng tính cost (.xlsx) đang dùng. App đọc các sheet DANH MỤC, GIÁ NHẬP, THAM SỐ, CHI TIẾT COMBO, KẾT QUẢ COMBO, Vận hành sàn yêu cầu và cho xem trước mã đổi giá trước khi nhập. <i>Lưu file Excel (Ctrl+S) trước khi nhập để có số mới nhất.</i></li>' +
  '<li><b>Cách 2:</b> <b>Dán bảng giá</b>: copy 2 cột Mã | Đơn giá từ Excel/MISA.</li>' +
  '<li><b>Cách 3:</b> sửa trực tiếp ô giá trong bảng sản phẩm, hoặc tab <b>Tham số</b>.</li></ul>' +

  '<li><b>Máy tính (Windows):</b> nháy đúp file <code>TinhCostCombo.html</code> – mở bằng Chrome hoặc Edge. Không cần mạng. Nên tạo lối tắt ra màn hình nền.</li>' +
  '<li><b>Android:</b> gửi file <code>TinhCostCombo.html</code> sang điện thoại (Zalo, USB…) → mở bằng <b>Chrome</b>. Hoặc dùng cách cài như iPhone bên dưới (ổn định hơn).</li>' +

/* =========================================================
   15. KHỞI ĐỘNG
   ========================================================= */
function init(){
  applyTheme(); renderShell(); renderNav(); renderTab();
  setSaveState(STORAGE_OK ? (S.meta.saved ? 'Đã lưu' : '') : 'Không lưu được – dùng sao lưu', !STORAGE_OK);
  window.addEventListener('beforeunload', function(){ save(); });
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'hidden') save(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && document.querySelector('link[rel=manifest]')){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
  if (!STORAGE_OK) setTimeout(function(){ toast('Trình duyệt đang chặn lưu dữ liệu. Hãy mở bằng Chrome/Edge/Safari thường (không ẩn danh) hoặc nhớ xuất sao lưu.', 'bad'); }, 600);
}
window.__APP = {get S(){ return S; }, calc: calc, importFile: importExcelFile, exportCombos: exportCombos, suggest: suggest, readWorkbook: readWorkbook, mapWorkbook: mapWorkbook, parsePaste: parsePaste, xlsxBlob: xlsxBlob, rebuildIndex: rebuildIndex, go: go, prod: prod,
  setState: function(st){ S = migrate(st); rebuildIndex(); save(); renderNav(); renderTab(); }};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
